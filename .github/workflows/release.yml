name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: semantic-flow-release
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: git config --global core.autocrlf false
      - run: npm ci --prefix scripts
      - run: npm test --prefix scripts
      - run: npm exec --prefix scripts -- playwright install chromium
      - run: npm run test:browser --prefix scripts
      - run: npm run release --prefix scripts -- package
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - run: npm run build --prefix scripts
      - run: npm run release --prefix scripts -- publish
        env:
          GH_TOKEN: ${{ github.token }}
