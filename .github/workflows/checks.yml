name: Checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The minimum Node.js on every operating system; newer supported LTS
        # lines on Linux. Keep in step with MINIMUM_NODE_MAJOR.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: git config --global core.autocrlf false
      - run: npm ci --prefix scripts
      - run: npm test --prefix scripts
      - run: npm exec --prefix scripts -- playwright install chromium
      - run: npm run test:browser --prefix scripts
      - run: npm run release --prefix scripts -- package
