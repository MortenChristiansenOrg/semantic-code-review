name: Checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: git config --global core.autocrlf false
      - run: npm ci --prefix scripts
      - run: npm test --prefix scripts
      - run: npm exec --prefix scripts -- playwright install chromium
      - run: npm run test:browser --prefix scripts
      - run: npm run release --prefix scripts -- package
