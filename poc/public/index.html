<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Local semantic review workspace for AI-assisted implementation artifacts."
    >
    <title>Semantic Review Workspace</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#stage-detail">Skip to selected stage</a>
    <div class="app-shell">
      <header class="masthead">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">SR</span>
          <div>
            <p class="eyebrow">Local review workspace</p>
            <p class="brand-name">Semantic Review</p>
          </div>
        </div>
        <div class="masthead-actions">
          <span class="connection-status" id="connection-status">
            Loading artifact
          </span>
          <button class="review-toggle" id="review-toggle" type="button">
            Review queue
            <span class="review-count" id="review-count">0</span>
          </button>
          <button class="reload-button" id="reload-button" type="button">
            Reload
          </button>
        </div>
      </header>

      <main id="workspace" aria-live="polite">
        <section class="loading-state">
          <p class="eyebrow">Reading implementation graph</p>
          <h1>Reconstructing the review narrative…</h1>
        </section>
      </main>
      <aside
        class="feedback-panel"
        id="feedback-panel"
        aria-label="Review feedback"
        aria-hidden="true"
      ></aside>
    </div>
    <dialog class="comment-dialog" id="comment-dialog">
      <form method="dialog" id="comment-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Add to review queue</p>
            <h2>Comment on this evidence</h2>
          </div>
          <button
            class="icon-button"
            type="button"
            id="comment-close"
            aria-label="Close comment dialog"
          >
            ×
          </button>
        </div>
        <p class="comment-target" id="comment-target"></p>
        <label class="field-label" for="comment-body">Feedback</label>
        <textarea
          id="comment-body"
          name="body"
          rows="5"
          required
          placeholder="Describe what should change and why."
        ></textarea>
        <p class="form-error" id="comment-error" role="alert"></p>
        <div class="dialog-actions">
          <button class="secondary-button" type="button" id="comment-cancel">
            Cancel
          </button>
          <button class="primary-button" type="submit">Add comment</button>
        </div>
      </form>
    </dialog>
    <template id="error-template">
      <section class="error-state" role="alert">
        <p class="eyebrow">Artifact could not be processed</p>
        <h1 data-error-title>Review unavailable</h1>
        <p data-error-message></p>
        <p class="error-guidance">
          Run the semantic review validator, correct the reported document, then
          reload this page.
        </p>
      </section>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
